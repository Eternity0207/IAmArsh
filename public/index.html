<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#131211" />
    <meta name="color-scheme" content="dark light" />
    <meta name="author" content="Arsh Goyal">
    <meta name="description" content="Arsh Goyal — software engineer and product builder at IIT Jodhpur." />
    <title>Arsh Goyal</title>
    <script>
        // Apply the saved (or system) theme before first paint to avoid a flash.
        (function () {
            var t;
            try { t = localStorage.getItem("theme"); } catch (e) {}
            if (t !== "light" && t !== "dark") {
                t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            }
            document.documentElement.setAttribute("data-theme", t);
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", t === "light" ? "#f4f1ea" : "#131211");
        })();
    </script>
    <style>
        /* Paint the theme background before the CSS bundle arrives. */
        html { background: #131211; }
        html[data-theme="light"] { background: #f4f1ea; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..700&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
    <noscript>You need to enable JavaScript to view this site.</noscript>
    <div id="root"></div>
</body>

</html>
